<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Chat Bot</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large"></ion-title>
    </ion-toolbar>
  </ion-header>

<ion-textarea
[ngModel]="prompt()"
(ngModelChange)="updatePromptValue($event)"
placeholder="Escribe tu mensaje..."
></ion-textarea>

<ion-button (click)="sendMessageToGemini()" [disabled]="spinner()">
  <ion-spinner name="crescent" *ngIf="spinner()"></ion-spinner>
  Enviar
</ion-button>
<ion-button (click)="onPickImage()">
  <ion-icon name="image-outline"></ion-icon>
</ion-button>

<img [src]="resultImage" alt="">

<ion-textarea [ngModel]="result()" readonly autoGrow="true"></ion-textarea>

</ion-content>
