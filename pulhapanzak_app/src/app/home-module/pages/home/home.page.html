<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Bienvenido {{this.nombre}} {{this.apellido}}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large"></ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
   <ion-button (click)="signOut()">Cerrar Sesion</ion-button>
  </div>
</ion-content>
