<ion-header [translucent]="true">
  <ion-toolbar color="danger">
    <p (click)="goLogin()">
      <ion-icon id="arrow-back" name="arrow-back-outline"></ion-icon>
    </p>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">reset</ion-title>
    </ion-toolbar>
  </ion-header>

  <h2 style="text-align: center; color: red; font-weight: bold;">Recupera tu Contraseña</h2>

  <form [formGroup]="resetForm" (ngSubmit)="resetPass()">
    <ion-item>
      <ion-label position="floating">Correo Electrónico</ion-label>
      <ion-input formControlName="correo" type="text"></ion-input>
      <ion-note color="danger" *ngIf="isEmailInvalid || isEmailError">
        <span *ngIf="isEmailInvalid">El correo es necesario!</span>
        <span *ngIf="isEmailError">El correo es invalido!</span>
      </ion-note>

    </ion-item>

      <ion-button type="submit" id="reset-btn" color="danger" [disabled]="isResetInvalid || disabled">
        Enviar Correo de Restablecimiento
        <ion-spinner *ngIf="spinner"></ion-spinner>
      </ion-button>

  </form>

</ion-content>
