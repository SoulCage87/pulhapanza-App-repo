<ion-header [translucent]="true">
  <ion-toolbar color="danger">
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <h2 style="text-align: center; color: red; font-weight: bold;">Inicio de Sesión</h2>

  <ion-card>
    <ion-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <ion-item>
          <ion-label>
            <ion-icon name="mail" color="danger"></ion-icon>
            <ion-text style="font-size: 18px;">Correo Electronico</ion-text>
            <ion-input type="text" [ngClass]="{'invalid-input': isEmailInvalid || isEmailRequired }"
              formControlName="correo" class="input-login"></ion-input>
            <ion-note color="danger" *ngIf="isEmailInvalid || isEmailRequired">
              <span *ngIf="isEmailInvalid">El correo es Invalido!</span>
              <span *ngIf="isEmailRequired">El campo es requerido!</span>
            </ion-note>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <ion-icon name="lock-closed" color="danger"></ion-icon>
            <ion-text style="font-size: 18px;">Contraseña</ion-text>
            <ion-input type="password" [ngClass]="{'invalid-input': isPassInvalid}" formControlName="pass"
              class="input-login">
              <ion-input-password-toggle slot="end" color="danger"></ion-input-password-toggle>
            </ion-input>
            <ion-note color="danger" *ngIf="isPassInvalid">La contraseña es necesaria!</ion-note>
          </ion-label>
        </ion-item>

        <div id="forgotten-pass" (click)="goResetPass()"> 
          <ion-text slot="end">Olvidaste tu contraseña?</ion-text>
        </div>

        <ion-button color="danger" type="submit" id="login-btn" [disabled]="isLoginValid || disabled">
          Iniciar Sesion
          <ion-spinner *ngIf="spinner" id="spinner-login">
          </ion-spinner>
        </ion-button>


      </form>

      <ion-item id="or-options"></ion-item>

      <ion-row>
        <ion-col>
          <ion-button id="google-btn" expand="block" fill="outline" (click)="googleSignIn()">
            <ion-icon src="../../../../assets/icon/google.svg"></ion-icon>
            <p>Iniciar Sesion con Google</p>
          </ion-button>
        </ion-col>
      </ion-row>

      <ion-item id="account-create">
        <ion-row>
          <ion-col size="auto">
            <p>¿No tienes cuenta?</p>
          </ion-col>
          <ion-col size="auto">
            <p id="register-create" (click)="goRegister()">¡Registrate ahora!</p>
          </ion-col>
        </ion-row>
      </ion-item>

    </ion-card-content>
  </ion-card>

</ion-content>
